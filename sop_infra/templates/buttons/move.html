{% load i18n %}
{% comment %}
  {% load buttons %}
  {% load helpers %}
  <form action="{{ url }}?return_url={{ return_url }}" method="post">
    {% csrf_token %}
    {% for field, value in form_data.items %}
      <input type="hidden" name="{{ field }}" value="{{ value }}" />
    {% endfor %}
    <button type="submit" class="btn btn-purple" >
      <i class="mdi mdi-file-move-outline" aria-hidden="true"></i> {{ label }}
    </button>
  </form>
----MARKER----
{% endcomment %}
<a href="{{ url }}?return_url={{ return_url }}" class="btn btn-purple" role="button">
  <i class="mdi mdi-file-move-outline" aria-hidden="true"></i> {{ label }}
</a>
